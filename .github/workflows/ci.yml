name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: false
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test build -p ngx-gsap
      - run: npm run deps:validate
      - run: npx nx build angular-animations
      - run: npx playwright install --with-deps chromium
      - run: npx nx e2e e2e
